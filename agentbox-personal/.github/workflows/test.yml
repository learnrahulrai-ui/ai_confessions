name: Agentbox tests

on:
  pull_request:
    paths:
      - "agentbox-personal/**"
  push:
    branches:
      - agentbox-personal-v0.2
    paths:
      - "agentbox-personal/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentbox-personal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q agentbox tests
